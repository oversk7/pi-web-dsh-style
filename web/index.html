<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pi Web</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/themes.css" />
  </head>
  <body>
    <script>
      (() => {
        const saved = localStorage.getItem("pi-web-theme");
        const preference = ["light", "dark", "system"].includes(saved) ? saved : "system";
        const style = localStorage.getItem("pi-web-theme-style");
        document.body.dataset.themeStyle = ["classic", "sakura", "starlight"].includes(style) ? style : "classic";
        const systemDark = preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = preference === "dark" || systemDark;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.body.toggleAttribute("data-ds-dark-theme", dark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
